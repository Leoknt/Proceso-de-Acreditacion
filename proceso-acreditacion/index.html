<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Proceso de Acreditación · Ayuda de memoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>

  /* ======================================================================
     CATÁLOGO DE AFICHES — EDITAR ACÁ
     Cada objeto es un afiche. Copie el PDF dentro de la carpeta "pdfs"
     y agregue una entrada. "etapa" es opcional: si la deja vacía, el
     afiche aparece en "General".
     ====================================================================== */
</style>
</head>
<body>

<header class="topbar">
  <div class="seal" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="40" height="40">
      <circle cx="32" cy="32" r="29" fill="none" stroke="var(--gold)" stroke-width="2.5"/>
      <circle cx="32" cy="32" r="22" fill="none" stroke="var(--gold)" stroke-width="1.2" stroke-dasharray="2 3"/>
      <path d="M22 33 L29 40 L43 24" fill="none" stroke="var(--gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="titles">
    <p class="eyebrow">Ayuda de memoria para funcionarios</p>
    <h1>Proceso de Acreditación</h1>
  </div>
</header>

<main>
  <div class="searchwrap">
    <svg class="searchicon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input id="buscador" type="search" placeholder="Buscar un afiche por nombre o tema…" autocomplete="off">
  </div>

  <div id="chips" class="chips" role="tablist" aria-label="Filtrar por etapa"></div>

  <p id="contador" class="contador"></p>

  <ul id="lista" class="lista"></ul>

  <p id="vacio" class="vacio" hidden>No hay afiches que coincidan con la búsqueda.</p>
</main>

<footer class="foot">
  <p>Documentos internos del hospital · toque un afiche para abrirlo</p>
</footer>

<div id="visor" class="visor" hidden>
  <div class="visor-barra">
    <button id="cerrarVisor" class="cerrar" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <span id="visorTitulo" class="visor-titulo"></span>
    <a id="visorAbrir" class="visor-abrir" target="_blank" rel="noopener">Abrir en el visor del teléfono ↗</a>
  </div>
  <iframe id="visorFrame" title="Visor de PDF"></iframe>
</div>

<script>
/* ============================================================================
   CATÁLOGO DE AFICHES
   ----------------------------------------------------------------------------
   Para agregar un afiche nuevo:
     1) Copie el archivo PDF dentro de la carpeta "pdfs/"
     2) Agregue un objeto acá abajo con: archivo, titulo, descripcion y etapa
   El campo "archivo" debe coincidir EXACTO con el nombre del PDF (con .pdf)
   ============================================================================ */
const CATALOGO = [
  {
    archivo: "pdfs/01-autoevaluacion.pdf",
    titulo: "Autoevaluación institucional",
    descripcion: "Cómo se revisa el cumplimiento de los estándares antes de la visita de los evaluadores externos.",
    etapa: "Autoevaluación"
  },
  {
    archivo: "pdfs/02-estandares-generales.pdf",
    titulo: "Estándares generales de seguridad del paciente",
    descripcion: "Resumen de los estándares transversales que aplican a todos los servicios clínicos.",
    etapa: "Estándares"
  },
  {
    archivo: "pdfs/03-evaluacion-externa.pdf",
    titulo: "Evaluación externa",
    descripcion: "Qué revisan los evaluadores, cómo se comportan las visitas y qué debe tener listo cada servicio.",
    etapa: "Evaluación externa"
  },
  {
    archivo: "pdfs/04-identificacion-paciente.pdf",
    titulo: "Identificación correcta del paciente",
    descripcion: "Pasos obligatorios antes de cualquier procedimiento, examen o administración de medicamentos.",
    etapa: "Estándares"
  }
  // ⬇ agregue más afiches acá, siguiendo el mismo formato ⬇
];

/* ============================================================================
   LÓGICA DE LA APP — no es necesario tocar esto para agregar afiches
   ============================================================================ */
const lista = document.getElementById('lista');
const buscador = document.getElementById('buscador');
const chipsWrap = document.getElementById('chips');
const contador = document.getElementById('contador');
const vacio = document.getElementById('vacio');
const visor = document.getElementById('visor');
const visorFrame = document.getElementById('visorFrame');
const visorTitulo = document.getElementById('visorTitulo');
const visorAbrir = document.getElementById('visorAbrir');

let etapaActiva = 'Todas';

function etapasUnicas() {
  const set = new Set(CATALOGO.map(a => a.etapa && a.etapa.trim() ? a.etapa.trim() : 'General'));
  return ['Todas', ...Array.from(set)];
}

function pintarChips() {
  chipsWrap.innerHTML = '';
  etapasUnicas().forEach(et => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (et === etapaActiva ? ' chip-activo' : '');
    btn.textContent = et;
    btn.addEventListener('click', () => { etapaActiva = et; pintarChips(); pintarLista(); });
    chipsWrap.appendChild(btn);
  });
}

function pintarLista() {
  const q = buscador.value.trim().toLowerCase();
  const items = CATALOGO.filter(a => {
    const et = a.etapa && a.etapa.trim() ? a.etapa.trim() : 'General';
    const pasaEtapa = etapaActiva === 'Todas' || et === etapaActiva;
    const texto = (a.titulo + ' ' + a.descripcion).toLowerCase();
    const pasaTexto = q === '' || texto.includes(q);
    return pasaEtapa && pasaTexto;
  });

  lista.innerHTML = '';
  items.forEach((a, i) => {
    const et = a.etapa && a.etapa.trim() ? a.etapa.trim() : 'General';
    const li = document.createElement('li');
    li.className = 'tarjeta';
    li.style.setProperty('--i', i);
    li.innerHTML = `
      <button class="tarjeta-btn" type="button">
        <span class="tarjeta-icono" aria-hidden="true">
          <svg viewBox="0 0 24 28" width="22" height="26">
            <path d="M3 1.5h13l5 5V26.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2.5a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M16 1.5V6.5a1 1 0 0 0 1 1H21.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </span>
        <span class="tarjeta-texto">
          <span class="tarjeta-etapa">${et}</span>
          <span class="tarjeta-titulo">${a.titulo}</span>
          <span class="tarjeta-desc">${a.descripcion}</span>
        </span>
        <span class="tarjeta-flecha" aria-hidden="true">›</span>
      </button>
    `;
    li.querySelector('.tarjeta-btn').addEventListener('click', () => abrirPdf(a));
    lista.appendChild(li);
  });

  vacio.hidden = items.length !== 0;
  contador.textContent = items.length === 0 ? '' :
    (items.length === 1 ? '1 afiche' : items.length + ' afiches');
}

function abrirPdf(a) {
  visorTitulo.textContent = a.titulo;
  visorFrame.src = a.archivo;
  visorAbrir.href = a.archivo;
  visor.hidden = false;
  document.body.style.overflow = 'hidden';
}

document.getElementById('cerrarVisor').addEventListener('click', () => {
  visor.hidden = true;
  visorFrame.src = '';
  document.body.style.overflow = '';
});

buscador.addEventListener('input', pintarLista);

pintarChips();
pintarLista();
</script>

<style>
:root{
  --bg: #F5F7F6;
  --surface: #FFFFFF;
  --ink: #142B2E;
  --ink-soft: #4C6164;
  --teal-deep: #0F3A3E;
  --teal: #1C6B6E;
  --gold: #B9862E;
  --gold-soft: #F3E7CE;
  --line: #DCE3E1;
  --radius: 14px;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding-bottom: 40px;
}

.topbar{
  background: var(--teal-deep);
  color: #fff;
  padding: 22px 20px 26px;
  display:flex;
  align-items:center;
  gap: 14px;
  border-radius: 0 0 22px 22px;
}
.seal{ flex-shrink:0; display:flex; }
.eyebrow{
  margin:0 0 4px;
  font-family:'IBM Plex Mono', monospace;
  font-size: 11.5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #BFDAD9;
}
h1{
  margin:0;
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size: 25px;
  line-height:1.15;
}

main{ max-width: 640px; margin: 0 auto; padding: 18px 16px 0; }

.searchwrap{
  position:relative;
  margin-bottom: 14px;
}
.searchicon{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  color: var(--ink-soft);
  pointer-events:none;
}
#buscador{
  width:100%;
  padding: 13px 14px 13px 40px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  color: var(--ink);
}
#buscador:focus{
  outline: 2px solid var(--teal);
  outline-offset: 1px;
}

.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom: 4px;
  margin-bottom: 6px;
  -webkit-overflow-scrolling: touch;
}
.chips::-webkit-scrollbar{ display:none; }
.chip{
  flex-shrink:0;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 7px 13px;
  border-radius: 999px;
  cursor:pointer;
}
.chip-activo{
  background: var(--teal-deep);
  border-color: var(--teal-deep);
  color:#fff;
}
.chip:focus-visible{ outline: 2px solid var(--teal); outline-offset:2px; }

.contador{
  margin: 10px 2px 8px;
  font-family:'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--ink-soft);
  letter-spacing:.03em;
}

.lista{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }

.tarjeta-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap: 12px;
  text-align:left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  cursor:pointer;
  font-family: inherit;
  color: inherit;
}
.tarjeta-btn:active{ background: var(--gold-soft); }
.tarjeta-btn:focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }

.tarjeta-icono{
  flex-shrink:0;
  width: 38px; height: 38px;
  border-radius: 9px;
  background: var(--teal-deep);
  color: #fff;
  display:flex; align-items:center; justify-content:center;
}

.tarjeta-texto{ display:flex; flex-direction:column; gap: 2px; min-width:0; }
.tarjeta-etapa{
  font-family:'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color: var(--gold);
}
.tarjeta-titulo{
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size: 15.5px;
  color: var(--ink);
}
.tarjeta-desc{
  font-size: 13px;
  color: var(--ink-soft);
  line-height:1.35;
}

.tarjeta-flecha{
  margin-left:auto;
  flex-shrink:0;
  font-size: 22px;
  color: var(--line);
}

.vacio{
  text-align:center;
  color: var(--ink-soft);
  font-size: 14px;
  padding: 30px 10px;
}

.foot{
  max-width:640px;
  margin: 26px auto 0;
  padding: 0 16px;
  text-align:center;
  color: var(--ink-soft);
  font-size: 12px;
}

.visor{
  position: fixed; inset:0;
  background: var(--ink);
  z-index: 100;
  display:flex;
  flex-direction:column;
}
.visor-barra{
  display:flex;
  align-items:center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--teal-deep);
  color:#fff;
}
.cerrar{
  background:none; border:none; color:#fff;
  display:flex; padding:4px; cursor:pointer;
  border-radius: 6px;
}
.cerrar:focus-visible{ outline:2px solid var(--gold); }
.visor-titulo{
  font-family:'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
}
.visor-abrir{
  font-family:'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--gold-soft);
  text-decoration:none;
  flex-shrink:0;
}
#visorFrame{
  flex:1;
  width:100%;
  border:none;
  background:#fff;
}

@media (prefers-reduced-motion: no-preference){
  .tarjeta{ animation: entrar .28s ease both; animation-delay: calc(var(--i) * 30ms); }
  @keyframes entrar{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }
}
</style>
</body>
</html>
