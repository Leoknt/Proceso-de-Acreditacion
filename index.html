<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Proceso de Acreditación · Ayuda de memoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <div class="logos-container">
    <img src="logo.png" alt="Logo Hospital" class="logo-hospital" style="height: 100px; width: auto;">
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="36" height="36">
        <circle cx="32" cy="32" r="29" fill="none" stroke="var(--gold)" stroke-width="2.5"/>
        <circle cx="32" cy="32" r="22" fill="none" stroke="var(--gold)" stroke-width="1.2" stroke-dasharray="2 3"/>
        <path d="M22 33 L29 40 L43 24" fill="none" stroke="var(--gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
  <div class="titles">
    <p class="eyebrow">Ayuda de memoria para funcionarios</p>
    <h1>Proceso de Acreditación</h1>
  </div>
</header>

<main>
  <div class="searchwrap">
    <svg class="searchicon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input id="buscador" type="search" placeholder="Buscar un afiche por nombre o tema…" autocomplete="off" disabled>
  </div>

  <div id="chips" class="chips" role="tablist" aria-label="Filtrar por etapa"></div>

  <p id="estado" class="estado">Cargando afiches…</p>

  <ul id="lista" class="lista"></ul>

  <p id="vacio" class="vacio" hidden>No hay afiches que coincidan con la búsqueda.</p>

  <div id="errorBox" class="errorbox" hidden>
    <p class="errorbox-titulo">No se pudieron cargar los afiches automáticamente.</p>
    <p id="errorDetalle" class="errorbox-detalle"></p>
    <button id="reintentar" class="errorbox-btn" type="button">Reintentar</button>
  </div>
</main>

<footer class="foot">
  <p>Documentos internos del hospital · toque un afiche para abrirlo</p>
</footer>

<script>
const CACHE_KEY = 'acreditacion_catalogo_v1';
const CACHE_MINUTOS = 10;

const els = {
  buscador: document.getElementById('buscador'),
  chips: document.getElementById('chips'),
  estado: document.getElementById('estado'),
  lista: document.getElementById('lista'),
  vacio: document.getElementById('vacio'),
  errorBox: document.getElementById('errorBox'),
  errorDetalle: document.getElementById('errorDetalle'),
  reintentar: document.getElementById('reintentar'),
};

let CATALOGO = [];
let etapaActiva = 'Todas';

function detectarRepoGitHub() {
  const host = location.hostname;
  if (!host.endsWith('github.io')) return null;
  const user = host.split('.')[0];
  const partes = location.pathname.split('/').filter(Boolean);
  const repo = partes[0];
  if (!user || !repo) return null;
  return { user, repo };
}

function tituloDesdeArchivo(nombre) {
  const sinExt = nombre.replace(/\.[^.]+$/, '');
  const sinPrefijo = sinExt.replace(/^\d+[-_.\s]*/, '');
  const conEspacios = sinPrefijo.replace(/[-_]+/g, ' ').trim();
  const base = conEspacios.length ? conEspacios : sinExt;
  return base.charAt(0).toUpperCase() + base.slice(1);
}

function iconoPara(nombre) {
  const ext = (nombre.split('.').pop() || '').toLowerCase();
  if (['jpg','jpeg','png','gif','webp'].includes(ext)) return 'imagen';
  if (ext === 'pdf') return 'pdf';
  return 'archivo';
}

async function obtenerJSON(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function cargarCatalogoDesdeGitHub() {
  const repoInfo = detectarRepoGitHub();
  if (!repoInfo) {
    throw new Error('Esta página no parece estar en GitHub Pages.');
  }
  const { user, repo } = repoInfo;

  const archivos = await obtenerJSON(`https://api.github.com/repos/${user}/${repo}/contents/pdfs`);
  if (!Array.isArray(archivos)) {
    throw new Error('La carpeta "pdfs" no existe en el repositorio.');
  }

  let meta = {};
  const archivoInfo = archivos.find(f => f.name.toLowerCase() === 'info.json');
  if (archivoInfo) {
    try { meta = await obtenerJSON(archivoInfo.download_url); } catch (e) {}
  }

  const items = archivos
    .filter(f => f.type === 'file' && !f.name.startsWith('.') && f.name.toLowerCase() !== 'info.json')
    .map(f => {
      const m = meta[f.name] || {};
      return {
        archivo: f.download_url,
        nombreArchivo: f.name,
        titulo: m.titulo || tituloDesdeArchivo(f.name),
        descripcion: m.descripcion || '',
        etapa: (m.etapa && m.etapa.trim()) ? m.etapa.trim() : 'General',
        icono: iconoPara(f.name),
      };
    });

  if (items.length === 0) {
    throw new Error('La carpeta "pdfs" existe pero está vacía.');
  }
  return items;
}

function guardarCache(items) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ items, ts: Date.now() }));
  } catch (e) {}
}

function leerCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

async function iniciar() {
  els.errorBox.hidden = true;
  els.estado.hidden = false;
  els.estado.textContent = 'Cargando afiches…';

  const cache = leerCache();
  const cacheFresca = cache && (Date.now() - cache.ts) < CACHE_MINUTOS * 60 * 1000;

  if (cacheFresca) {
    CATALOGO = cache.items;
    render();
    return;
  }

  try {
    const items = await cargarCatalogoDesdeGitHub();
    CATALOGO = items;
    guardarCache(items);
    render();
  } catch (err) {
    if (cache && cache.items && cache.items.length) {
      CATALOGO = cache.items;
      render();
      els.estado.hidden = false;
      els.estado.textContent = 'Mostrando la última versión guardada.';
    } else {
      mostrarError(err.message || String(err));
    }
  }
}

function mostrarError(detalle) {
  els.estado.hidden = true;
  els.lista.innerHTML = '';
  els.vacio.hidden = true;
  els.errorBox.hidden = false;
  els.errorDetalle.textContent = detalle;
}

function etapasUnicas() {
  const set = new Set(CATALOGO.map(a => a.etapa));
  return ['Todas', ...Array.from(set)];
}

function pintarChips() {
  const etapas = etapasUnicas();
  els.chips.innerHTML = '';
  if (etapas.length <= 2) return;
  etapas.forEach(et => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (et === etapaActiva ? ' chip-activo' : '');
    btn.textContent = et;
    btn.addEventListener('click', () => { etapaActiva = et; pintarChips(); pintarLista(); });
    els.chips.appendChild(btn);
  });
}

function svgIcono(tipo) {
  if (tipo === 'imagen') {
    return `<svg viewBox="0 0 24 24" width="22" height="22"><rect x="2" y="3" width="20" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="9" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 17 L9.5 12 L14 15.5 L16.5 13 L20 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  }
  return `<svg viewBox="0 0 24 28" width="22" height="26"><path d="M3 1.5h13l5 5V26.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2.5a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 1.5V6.5a1 1 0 0 0 1 1H21.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
}

function pintarLista() {
  const q = els.buscador.value.trim().toLowerCase();
  const items = CATALOGO.filter(a => {
    const pasaEtapa = etapaActiva === 'Todas' || a.etapa === etapaActiva;
    const texto = (a.titulo + ' ' + a.descripcion).toLowerCase();
    const pasaTexto = q === '' || texto.includes(q);
    return pasaEtapa && pasaTexto;
  });

  els.lista.innerHTML = '';
  items.forEach((a, i) => {
    const li = document.createElement('li');
    li.className = 'tarjeta';
    li.style.setProperty('--i', i);
    li.innerHTML = `
      <a class="tarjeta-btn" href="${a.archivo}" target="_blank" rel="noopener">
        <span class="tarjeta-icono" aria-hidden="true">${svgIcono(a.icono)}</span>
        <span class="tarjeta-texto">
          <span class="tarjeta-etapa">${a.etapa}</span>
          <span class="tarjeta-titulo">${a.titulo}</span>
          ${a.descripcion ? `<span class="tarjeta-desc">${a.descripcion}</span>` : ''}
        </span>
        <span class="tarjeta-flecha" aria-hidden="true">›</span>
      </a>
    `;
    els.lista.appendChild(li);
  });

  els.vacio.hidden = items.length !== 0;
  els.estado.hidden = items.length === 0 ? true : true;
}

function render() {
  els.buscador.disabled = false;
  els.errorBox.hidden = true;
  pintarChips();
  pintarLista();
  if (CATALOGO.length) {
    els.estado.hidden = true;
  }
}

els.buscador.addEventListener('input', pintarLista);
els.reintentar.addEventListener('click', () => {
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
  iniciar();
});

iniciar();
</script>

<style>
:root{
  --bg: #F5F7F6;
  --surface: #FFFFFF;
  --ink: #142B2E;
  --ink-soft: #4C6164;
  --teal-deep: #0F3A3E;
  --teal: #1C6B6E;
  --gold: #B9862E;
  --gold-soft: #F3E7CE;
  --line: #DCE3E1;
  --radius: 14px;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding-bottom: 40px;
}

.topbar {
  background: var(--teal-deep);
  color: #fff;
  padding: 22px 20px 26px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-radius: 0 0 22px 22px;
}

.logos-container {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.logo-hospital {
  height: 80px;
  width: auto;
  object-fit: contain;
}

.seal {
  flex-shrink: 0;
  display: flex;
}

.eyebrow{
  margin:0 0 4px;
  font-family:'IBM Plex Mono', monospace;
  font-size: 11.5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #BFDAD9;
}

h1{
  margin:0;
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size: 25px;
  line-height:1.15;
}

main{ max-width: 640px; margin: 0 auto; padding: 18px 16px 0; }

.searchwrap{ position:relative; margin-bottom: 14px; }
.searchicon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color: var(--ink-soft); pointer-events:none; }
#buscador{
  width:100%;
  padding: 13px 14px 13px 40px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  color: var(--ink);
}
#buscador:disabled{ opacity: .6; }
#buscador:focus{ outline: 2px solid var(--teal); outline-offset: 1px; }

.chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom: 4px; margin-bottom: 6px; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar{ display:none; }
.chip{
  flex-shrink:0;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 7px 13px;
  border-radius: 999px;
  cursor:pointer;
}
.chip-activo{ background: var(--teal-deep); border-color: var(--teal-deep); color:#fff; }
.chip:focus-visible{ outline: 2px solid var(--teal); outline-offset:2px; }

.estado{
  margin: 10px 2px 12px;
  font-family:'IBM Plex Mono', monospace;
  font-size: 12.5px;
  color: var(--ink-soft);
  letter-spacing:.02em;
}

.lista{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }

.tarjeta-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap: 12px;
  text-align:left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  cursor:pointer;
  font-family: inherit;
  color: inherit;
  text-decoration:none;
}
.tarjeta-btn:active{ background: var(--gold-soft); }
.tarjeta-btn:focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }

.tarjeta-icono{
  flex-shrink:0;
  width: 38px; height: 38px;
  border-radius: 999px;
  background: var(--teal-deep);
  color: #fff;
  display:flex; align-items:center; justify-content:center;
}

.tarjeta-texto{ display:flex; flex-direction:column; gap: 2px; min-width:0; }
.tarjeta-etapa{
  font-family:'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color: var(--gold);
}
.tarjeta-titulo{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size: 15.5px; color: var(--ink); }
.tarjeta-desc{ font-size: 13px; color: var(--ink-soft); line-height:1.35; }
.tarjeta-flecha{ margin-left:auto; flex-shrink:0; font-size: 22px; color: var(--line); }

.vacio{ text-align:center; color: var(--ink-soft); font-size: 14px; padding: 30px 10px; }

.errorbox{
  margin-top: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  text-align:center;
}
.errorbox-titulo{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size: 15px; margin: 0 0 6px; }
.errorbox-detalle{ font-size: 13px; color: var(--ink-soft); margin: 0 0 14px; line-height:1.4; }
.errorbox-btn{
  background: var(--teal-deep);
  color:#fff;
  border:none;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  cursor:pointer;
}

.foot{ max-width:640px; margin: 26px auto 0; padding: 0 16px; text-align:center; color: var(--ink-soft); font-size: 12px; }

@media (prefers-reduced-motion: no-preference){
  .tarjeta{ animation: entrar .28s ease both; animation-delay: calc(var(--i) * 30ms); }
  @keyframes entrar{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform: translateY(0); } }
}
</style>
</body>
</html>
